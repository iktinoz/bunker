# Extends gitleaks' built-in ruleset with the paths and key formats specific to
# this repo - see AGENTS.md "Never commit". The defaults do not cover these:
# the VPN profile carries a CA certificate and an OpenVPN *static* key (neither
# matches the built-in private-key rule), and the two Claude config files hold
# personal settings rather than anything credential-shaped.
[extend]
useDefault = true

# Force-adding a gitignored config file is the realistic failure mode, so match
# on path alone. The `$` anchors keep the *.template counterparts committable.
[[rules]]
id = "bunker-protected-config"
description = "Gitignored on purpose - commit the .template instead (AGENTS.md)"
path = '''^(config/opencode\.json|config/claude/settings\.json|config/claude/CLAUDE\.md)$'''

# Catches a VPN profile saved under any name, not just the documented one.
[[rules]]
id = "bunker-openvpn-profile"
description = "OpenVPN profile - only vpn/openvpn.ovpn.template may be committed"
path = '''\.ovpn$'''

# Gitleaks' private-key rule does not know this header.
[[rules]]
id = "openvpn-static-key"
description = "OpenVPN tls-auth/tls-crypt static key"
regex = '''-----BEGIN OpenVPN Static key V1-----'''

# vpn/openvpn.ovpn.template ships this exact header wrapping a
# [TLS_AUTH_KEY_CONTENT] placeholder, so editing the template must stay possible.
[[rules.allowlists]]
paths = ['''\.template$''']
