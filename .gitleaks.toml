# Extends gitleaks' built-in ruleset with the key formats specific to this repo -
# see AGENTS.md "Never commit". The defaults do not cover the VPN profile: it carries
# a CA certificate and an OpenVPN *static* key, and neither matches the built-in
# private-key rule.
#
# Personal agent config is no longer kept here at all - it lives in the dotfiles repo,
# which has its own gitleaks hook. bunker holds only sandbox-specific overlays, and
# those contain no credentials by design: the opencode API key is read from the
# environment at runtime and never enters the image.
[extend]
useDefault = true

# Catches a VPN profile saved under any name, not just the documented one.
[[rules]]
id = "bunker-openvpn-profile"
description = "OpenVPN profile - only vpn/openvpn.ovpn.template may be committed"
path = '''\.ovpn$'''

# Gitleaks' private-key rule does not know this header.
[[rules]]
id = "openvpn-static-key"
description = "OpenVPN tls-auth/tls-crypt static key"
regex = '''-----BEGIN OpenVPN Static key V1-----'''

# vpn/openvpn.ovpn.template ships this exact header wrapping a
# [TLS_AUTH_KEY_CONTENT] placeholder, so editing the template must stay possible.
[[rules.allowlists]]
paths = ['''\.template$''']
