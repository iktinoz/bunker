version: "3"

vars:
  IMAGE: bunker-sandbox
  # Named volume holding Claude Code's login + session state, so `claude` stays
  # logged in across image rebuilds. Mounted at CLAUDE_CONFIG_DIR in the image.
  CLAUDE_VOLUME: bunker-claude
  CLAUDE_MOUNT: "{{.CLAUDE_VOLUME}}:/home/sandbox/.claude"
  # Bare dotfiles repo holding the personal agent config. $HOME is its work tree.
  DOTFILES_GIT: "{{.HOME}}/.dotfiles"
  DOTFILES_REF: master
  # Paths exported into the build context. Everything else in the dotfiles targets a
  # desktop this container does not have.
  DOTFILES_PATHS: ".claude .config/fish .config/opencode .gitconfig"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - go-task --list

  dotfiles:export:
    desc: Export the tracked dotfiles paths into the build context
    internal: true
    cmds:
      # `git archive` reads the bare repo directly: no network, no SSH, no credentials,
      # and file modes survive. A path that is not tracked aborts the export, so a
      # forgotten `dotfiles add` breaks the build instead of shipping a config-less
      # image. Only committed state is exported - commit before you build.
      - rm -rf .build/dotfiles
      - mkdir -p .build/dotfiles
      - git --git-dir="{{.DOTFILES_GIT}}" archive {{.DOTFILES_REF}} {{.DOTFILES_PATHS}} | tar -x -C .build/dotfiles
      - test -f .build/dotfiles/.claude/settings.json

  sandbox:build:
    desc: Build sandbox Docker image (exports the dotfiles first)
    deps: [dotfiles:export]
    cmds:
      # Docker keys the COPY layer on the exported content, so this rebuilds exactly
      # when the dotfiles change. No build arg needed.
      - docker build -t {{.IMAGE}} .

  sandbox:run:
    desc: "Run sandbox with VPN + opencode/claude (requires VPN config). Optional: pass a host path to mount as entry folder (e.g. task sandbox:run -- /repo/)"
    cmds:
      - |
        if [ -n "{{.CLI_ARGS}}" ]; then
          docker run --rm -it --cap-add=NET_ADMIN --device /dev/net/tun \
            -p 4747:4747 \
            -e OFFIS_LITELLM_API_KEY \
            -v "{{.CLAUDE_MOUNT}}" \
            -v "{{.CLI_ARGS}}:{{.CLI_ARGS}}" \
            -e ENTRY_DIR="{{.CLI_ARGS}}" \
            {{.IMAGE}}
        else
          docker run --rm -it --cap-add=NET_ADMIN --device /dev/net/tun \
            -p 4747:4747 \
            -e OFFIS_LITELLM_API_KEY \
            -v "{{.CLAUDE_MOUNT}}" \
            {{.IMAGE}}
        fi

  sandbox:run-no-vpn:
    desc: "Run sandbox without VPN (opencode/claude only). Optional: pass a host path to mount as entry folder (e.g. task sandbox:run-no-vpn -- /repo/)"
    cmds:
      - |
        if [ -n "{{.CLI_ARGS}}" ]; then
          docker run --rm -it \
            -p 4747:4747 \
            -e SKIP_VPN=1 \
            -e OFFIS_LITELLM_API_KEY \
            -v "{{.CLAUDE_MOUNT}}" \
            -v "{{.CLI_ARGS}}:{{.CLI_ARGS}}" \
            -e ENTRY_DIR="{{.CLI_ARGS}}" \
            {{.IMAGE}}
        else
          docker run --rm -it -p 4747:4747 -e SKIP_VPN=1 -e OFFIS_LITELLM_API_KEY -v "{{.CLAUDE_MOUNT}}" {{.IMAGE}}
        fi

  sandbox:shell:
    desc: Enter sandbox shell for debugging
    cmds:
      - docker run --rm -it -e SKIP_VPN=1 -e OFFIS_LITELLM_API_KEY -v "{{.CLAUDE_MOUNT}}" {{.IMAGE}} bash

  sandbox:clean:
    desc: Remove bunker-sandbox image
    cmds:
      - docker rmi {{.IMAGE}}

  sandbox:logs:
    desc: View logs from running sandbox
    cmds:
      - docker logs {{.IMAGE}}

  claude:login:
    desc: One-time Claude Code login; the session is stored in the persistent volume
    cmds:
      - docker run --rm -it -e SKIP_VPN=1 -e OFFIS_LITELLM_API_KEY -v "{{.CLAUDE_MOUNT}}" {{.IMAGE}} claude

  claude:reset:
    desc: Delete the Claude Code state volume (forces a fresh login)
    cmds:
      - docker volume rm {{.CLAUDE_VOLUME}}

  config:preview:
    desc: Show what the build would stage as the sandbox's agent config (no container)
    deps: [dotfiles:export]
    cmds:
      # Same jq programs as scripts/stage-agent-config.sh, so a config question can be
      # answered without a build. Keep the two in sync.
      - echo "=== Claude Code settings.json (host-only plugin keys removed) ==="
      - jq 'del(.enabledPlugins, .extraKnownMarketplaces)' .build/dotfiles/.claude/settings.json
      - echo "=== opencode.json (sandbox overlay merged, host-only MCP dropped) ==="
      - jq -s '(.[0] | del(.mcp.gitnexus)) * .[1]' .build/dotfiles/.config/opencode/opencode.json config/opencode.sandbox.json
      - echo "=== /etc/claude-code/CLAUDE.md (sandbox memory, loads before yours) ==="
      - cat config/claude/CLAUDE.md

  hooks:install:
    desc: Install the gitleaks pre-commit hook (once per clone)
    cmds:
      - pre-commit install

  hooks:audit:
    desc: Scan the full commit history for secrets (one-off audit)
    cmds:
      # `pre-commit run --all-files` is NOT an audit: the gitleaks hook sets
      # pass_filenames: false and scans `--staged`, so with an empty index it
      # passes trivially. This scans every commit instead. Pinned to the same
      # version as the rev in .pre-commit-config.yaml.
      - docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner /repo
