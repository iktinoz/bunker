version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - go-task --list

  sandbox:build:
    desc: Build sandbox Docker image
    cmds:
      - docker build -t bunker-sandbox .

  sandbox:run:
    desc: "Run sandbox with VPN + opencode (requires VPN config). Optional: pass a host path to mount as entry folder (e.g. task sandbox:run -- /repo/)"
    cmds:
      - |
        if [ -n "{{.CLI_ARGS}}" ]; then
          docker run --rm -it --cap-add=NET_ADMIN --device /dev/net/tun \
            -v "{{.CLI_ARGS}}:{{.CLI_ARGS}}" \
            -e ENTRY_DIR="{{.CLI_ARGS}}" \
            bunker-sandbox
        else
          docker run --rm -it --cap-add=NET_ADMIN --device /dev/net/tun bunker-sandbox
        fi

  sandbox:run-no-vpn:
    desc: "Run sandbox without VPN (opencode only). Optional: pass a host path to mount as entry folder (e.g. task sandbox:run-no-vpn -- /repo/)"
    cmds:
      - |
        if [ -n "{{.CLI_ARGS}}" ]; then
          docker run --rm -it \
            -v "{{.CLI_ARGS}}:{{.CLI_ARGS}}" \
            -e ENTRY_DIR="{{.CLI_ARGS}}" \
            bunker-sandbox
        else
          docker run --rm -it bunker-sandbox
        fi

  sandbox:shell:
    desc: Enter sandbox shell for debugging
    cmds:
      - docker run --rm -it bunker-sandbox bash

  sandbox:clean:
    desc: Remove bunker-sandbox image
    cmds:
      - docker rmi bunker-sandbox

  sandbox:logs:
    desc: View logs from running sandbox
    cmds:
      - docker logs bunker-sandbox

  config:setup:
    desc: Setup opencode config from ~/.config/opencode
    cmds:
      - echo "Creating config directory..."
      - mkdir -p config
      - echo "Copying opencode config..."
      - cp ~/.config/opencode/opencode.json config/opencode.json
      - echo "opencode config copied to config/opencode.json"
      - |
        if [ -f ~/.config/opencode/tui.json ]; then
          cp ~/.config/opencode/tui.json config/tui.json
          echo "tui config copied to config/tui.json"
        else
          echo "No tui.json found in ~/.config/opencode/, skipping"
        fi
